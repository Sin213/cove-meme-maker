name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (no leading v)'
        required: false
        default: '0.0.0-dev'

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="${{ github.event.inputs.version }}"
            [ -z "$v" ] && v="0.0.0-dev"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: resolve-version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils tar xz-utils curl libfuse2

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 Pillow pyinstaller

      - name: Run Linux build script
        run: |
          chmod +x scripts/build-release.sh
          bash scripts/build-release.sh

      - name: Packaged tab-web smoke (AppImage)
        run: |
          set -euo pipefail
          APPIMAGE="release/Cove-Meme-Maker-${VERSION}-x86_64.AppImage"
          test -s "$APPIMAGE"
          chmod +x "$APPIMAGE"
          # AppImages need FUSE to self-mount. Hosted runners normally provide
          # /dev/fuse; if they ever stop, fall back to the AppImage runtime's
          # own extract-and-run mode rather than skipping the smoke.
          if [ ! -e /dev/fuse ]; then
            echo "No /dev/fuse - using AppImage extract-and-run for this smoke"
            export APPIMAGE_EXTRACT_AND_RUN=1
          fi
          python scripts/smoke_tab_web.py --exe "$APPIMAGE"

      - name: Validate .deb (contents, install, smoke, remove)
        run: |
          set -euo pipefail
          DEB="release/cove-meme-maker_${VERSION}_amd64.deb"
          test -s "$DEB"

          echo "==> Package metadata"
          dpkg-deb -I "$DEB"

          echo "==> Package contents"
          dpkg-deb -c "$DEB" > /tmp/deb-contents.txt
          for want in \
            usr/lib/cove-meme-maker/cove-meme-maker \
            usr/bin/cove-meme-maker \
            usr/share/applications/cove-meme-maker.desktop \
            usr/share/icons/hicolor/256x256/apps/cove-meme-maker.png ; do
            grep -q "$want" /tmp/deb-contents.txt || {
              echo "missing from .deb: $want"; exit 1; }
            echo "    $want OK"
          done

          # Remove the package even if the smoke below fails, so the runner is
          # never left with a half-validated install.
          cleanup() { sudo apt-get remove -y cove-meme-maker >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          echo "==> Installing"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y "./$DEB"
          dpkg -s cove-meme-maker | grep -q "Status: install ok installed"
          INSTALLED="$(command -v cove-meme-maker)"
          echo "    installed executable: $INSTALLED"

          echo "==> Packaged tab-web smoke (installed .deb)"
          python scripts/smoke_tab_web.py --exe "$INSTALLED"

          echo "==> Removing"
          trap - EXIT
          sudo DEBIAN_FRONTEND=noninteractive apt-get remove -y cove-meme-maker
          if dpkg -s cove-meme-maker 2>/dev/null | grep -q "Status: install ok installed"; then
            echo "package still installed after removal"; exit 1
          fi
          echo "    removed OK"

      - name: Generate SHA256 sidecars
        run: |
          cd release
          for f in *.AppImage *.deb; do
            [ -e "$f" ] || continue
            sha256sum "$f" > "$f.sha256"
          done
          for f in *.AppImage.sha256 *.deb.sha256; do
            [ -s "$f" ] || { echo "missing or empty sidecar: $f"; exit 1; }
          done
          ls -lh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            release/*.AppImage
            release/*.AppImage.sha256
          if-no-files-found: error

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: |
            release/*.deb
            release/*.deb.sha256
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.AppImage
            release/*.AppImage.sha256
            release/*.deb
            release/*.deb.sha256
          body_path: .github/RELEASE_NOTES_v${{ needs.resolve-version.outputs.version }}.md
          fail_on_unmatched_files: true

  build-macos:
    needs: resolve-version
    # macos-14 is the Apple Silicon (arm64) hosted runner. This release is
    # arm64-only: no x86_64, no universal2.
    runs-on: macos-14
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      APP_EXE: dist/Cove Meme Maker.app/Contents/MacOS/cove-meme-maker
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Verify runner is Apple Silicon
        run: |
          echo "uname -m: $(uname -m)"
          python -c "import platform; print('platform.machine():', platform.machine())"
          if [ "$(uname -m)" != "arm64" ]; then
            echo "Expected an arm64 runner, got $(uname -m)"
            exit 1
          fi

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 Pillow pyinstaller pytest

      - name: Run focused tests
        run: python -m pytest tests/test_tab_web.py tests/test_updater.py tests/test_packaging_macos.py tests/test_release_contracts.py -q

      - name: Run tab-web smoke (source)
        run: PYTHONPATH=src python scripts/smoke_tab_web.py

      - name: Run macOS build script
        run: |
          chmod +x scripts/build-macos.sh
          bash scripts/build-macos.sh

      - name: Validate .app bundle
        run: |
          test -d "dist/Cove Meme Maker.app"
          test -x "$APP_EXE"
          lipo -archs "$APP_EXE"
          [ "$(lipo -archs "$APP_EXE")" = "arm64" ]

      - name: Run tab-web smoke (packaged .app)
        run: python scripts/smoke_tab_web.py --exe "$APP_EXE"

      - name: Verify artifact names
        run: |
          zip="release/Cove-Meme-Maker-${VERSION}-macOS-arm64.zip"
          dmg="release/Cove-Meme-Maker-${VERSION}-macOS-arm64.dmg"
          test -s "$zip"
          test -s "$dmg"
          case "$zip" in *macOS-arm64.zip) ;; *) echo "bad zip name: $zip"; exit 1 ;; esac
          ls -lh release

      - name: Generate SHA256 sidecars
        run: |
          cd release
          for f in *-macOS-arm64.zip *-macOS-arm64.dmg; do
            [ -e "$f" ] || continue
            shasum -a 256 "$f" > "$f.sha256"
          done
          ls -lh

      - name: Upload macOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-zip
          path: |
            release/*-macOS-arm64.zip
            release/*-macOS-arm64.zip.sha256
          if-no-files-found: error

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: |
            release/*-macOS-arm64.dmg
            release/*-macOS-arm64.dmg.sha256
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*-macOS-arm64.zip
            release/*-macOS-arm64.zip.sha256
            release/*-macOS-arm64.dmg
            release/*-macOS-arm64.dmg.sha256
          body_path: .github/RELEASE_NOTES_v${{ needs.resolve-version.outputs.version }}.md
          fail_on_unmatched_files: true

  build-windows:
    needs: resolve-version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Windows build script
        shell: pwsh
        run: .\build.ps1 -Version $env:VERSION

      # The tab-web protocol smoke cannot run on Windows: the app connects to
      # Nexus over AF_UNIX, which CPython does not expose on Windows, and Nexus
      # only serves that socket on Linux. Windows always takes the Qt desktop
      # branch, so the packaged smoke here validates that real path instead.
      - name: Packaged launch smoke (Portable)
        shell: pwsh
        run: |
          .\scripts\smoke_launch_windows.ps1 -Exe "release\cove-meme-maker-${env:VERSION}-Portable.exe"

      - name: Install, smoke and uninstall Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = "release\cove-meme-maker-${env:VERSION}-Setup.exe"
          if (-not (Test-Path -LiteralPath $setup)) { throw "Setup not found: $setup" }
          if ((Get-Item -LiteralPath $setup).Length -le 0) { throw "Setup is empty: $setup" }

          $installDir = Join-Path $env:RUNNER_TEMP ("cmm-setup-" + [guid]::NewGuid().ToString('N').Substring(0,8))
          Write-Host "==> Installing silently to $installDir"
          # Inno Setup 6 silent flags (packaging/installer.iss). PrivilegesRequired=lowest,
          # so no elevation is needed for a per-user install into a temp dir.
          $p = Start-Process -FilePath (Resolve-Path -LiteralPath $setup).Path -Wait -PassThru -ArgumentList @(
              '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', "/DIR=$installDir"
          )
          if ($p.ExitCode -ne 0) { throw "Installer failed with exit code $($p.ExitCode)" }

          $installedExe = Join-Path $installDir 'cove-meme-maker.exe'
          if (-not (Test-Path -LiteralPath $installedExe)) {
              Get-ChildItem -LiteralPath $installDir -ErrorAction SilentlyContinue | Format-Table Name
              throw "Installed executable not found: $installedExe"
          }
          Write-Host "    installed executable: $installedExe"

          try {
              .\scripts\smoke_launch_windows.ps1 -Exe $installedExe
          }
          finally {
              $uninstaller = Join-Path $installDir 'unins000.exe'
              if (Test-Path -LiteralPath $uninstaller) {
                  Write-Host "==> Uninstalling silently"
                  $u = Start-Process -FilePath $uninstaller -Wait -PassThru -ArgumentList @(
                      '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
                  )
                  if ($u.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($u.ExitCode)" }
                  Write-Host "    uninstalled OK"
              } else {
                  throw "Uninstaller not found: $uninstaller"
              }
              if (Test-Path -LiteralPath $installedExe) {
                  throw "Executable still present after uninstall: $installedExe"
              }
              Remove-Item -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Generate SHA256 sidecars
        shell: pwsh
        run: |
          Set-Location release
          $files = @(Get-ChildItem -File | Where-Object { $_.Name -like '*-Setup.exe' -or $_.Name -like '*-Portable.exe' })
          if ($files.Count -eq 0) { throw "No Setup.exe or Portable.exe found in release/" }
          foreach ($f in $files) {
              $hash = (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLower()
              $line = "$hash  $($f.Name)`n"
              [System.IO.File]::WriteAllText("$($f.FullName).sha256", $line, [System.Text.Encoding]::ASCII)
          }
          foreach ($f in $files) {
              $sidecar = "$($f.FullName).sha256"
              if (-not (Test-Path -LiteralPath $sidecar)) { throw "Missing sidecar: $sidecar" }
              if ((Get-Item -LiteralPath $sidecar).Length -le 0) { throw "Empty sidecar: $sidecar" }
          }
          Get-ChildItem | Format-Table Name, Length

      - name: Upload Setup installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: |
            release/*-Setup.exe
            release/*-Setup.exe.sha256
          if-no-files-found: error

      - name: Upload Portable exe
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            release/*-Portable.exe
            release/*-Portable.exe.sha256
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*-Setup.exe
            release/*-Setup.exe.sha256
            release/*-Portable.exe
            release/*-Portable.exe.sha256
          body_path: .github/RELEASE_NOTES_v${{ needs.resolve-version.outputs.version }}.md
          fail_on_unmatched_files: true
